[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
code_size_limit = 100000

remappings = [
  "@account-abstraction/=lib/account-abstraction/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]
